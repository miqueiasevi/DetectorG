<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DetectorG - Resultado da Análise</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
    }

    .container {
      background: #020617;
      padding: 25px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 0 15px rgba(0,0,0,.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input[type=text] {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #0f172a;
      color: #fff;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #0f172a;
      color: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .resultado-box {
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      border: 1px dashed #2563eb;
      min-height: 80px;
    }

    .resultado-box h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }

    .resultado-box p {
      margin: 4px 0;
      font-size: 14px;
    }

    .info {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔍 Análise de Link - DetectorG</h2>

    <input type="text" id="link" placeholder="Cole o link aqui">

    <select id="plano">
      <option value="free">Plano Free</option>
      <option value="pro">Plano PRO</option>
    </select>

    <button onclick="verificarLink()">Analisar Link</button>

    <div class="resultado-box" id="resultado">
      Insira um link e selecione o plano para iniciar a análise.
    </div>

    <div class="info">
      Free: heurística básica. PRO: análise profunda com score detalhado.
    </div>
  </div>

  <script>
    async function verificarLink() {
      const link = document.getElementById("link").value.trim();
      const plano = document.getElementById("plano").value;
      const resultadoDiv = document.getElementById("resultado");

      if (!link) {
        resultadoDiv.textContent = "❌ Cole um link válido.";
        return;
      }

      // Aqui enviamos a requisição para o Flask
      const usuario = localStorage.getItem("detectorG_usuario") || "guest";

      try {
        const res = await fetch("/verificar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ link: link, usuario: usuario })
        });

        const data = await res.json();

        // Monta o resultado detalhado
        let html = `<h3>Nível de Risco: ${data.nivel}</h3>`;
        html += `<p>Score: ${data.score}</p>`;
        html += `<p>Ameaças detectadas: ${data.riscos.length ? data.riscos.join(", ") : "Nenhuma"}</p>`;

        resultadoDiv.innerHTML = html;

      } catch (err) {
        console.error(err);
        resultadoDiv.textContent = "❌ Erro ao analisar o link.";
      }
    }
  </script>
</body>
</html>
