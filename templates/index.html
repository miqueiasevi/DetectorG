<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DetectorG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <div class="logo">
    <i class="fa-solid fa-shield-halved"></i>
    <span>DetectorG</span>
  </div>
  <p id="usuarioLogado" class="subtitulo"></p>
</header>

<main class="container">
  <p id="status" class="status"></p>

  <div class="card">
    <h2><i class="fa-solid fa-link"></i> Verificar link ou site</h2>
    <input id="link" type="text" placeholder="Cole o link ou site aqui">
    <button class="btn-principal" onclick="verificarLink()">
      <i class="fa-solid fa-magnifying-glass"></i> Verificar
    </button>
    <p id="resultado" class="resultado"></p>
    <p id="contador" class="contador"></p>
  </div>

  <h3 class="titulo-planos">Plano pago</h3>
  <div class="planos">
    <div class="plano destaque" onclick="abrirPagamento()" style="cursor:pointer;">
      <h4><i class="fa-solid fa-star"></i> PRO</h4>
      <p>✔ Verificações ilimitadas</p>
      <p>✔ Detecção avançada</p>
      <p>✔ Sem anúncios</p>
      <button class="btn-secundario" type="button">Assinar PRO</button>
    </div>
  </div>

  <!-- Botão Excluir Conta -->
  <button class="btn-secundario" style="margin-top:20px; background:#ef4444; color:white;" onclick="excluirConta()">
    Excluir minha conta
  </button>
</main>

<div id="pagamento" class="modal hidden">
  <div class="modal-box plano destaque">
    <h4><i class="fa-solid fa-star"></i> Plano PRO</h4>
    <p><strong>Valor:</strong> R$ 9,90/mês</p>

    <input id="emailCliente" type="email" placeholder="Seu e-mail" readonly>
    <button class="btn-secundario" type="button" style="margin-top:10px;" onclick="solicitarCodigo()">Solicitar código PRO</button>

    <p class="info">Após o pagamento via Pix, enviaremos o código PRO para seu e-mail.</p>

    <p><strong>Chave Pix:</strong></p>
    <div class="pix-box">
      <input id="pixKey" type="text" readonly value="53596e06-332a-4bcd-b6fd-57ed712bc14d">
      <button class="btn-secundario" type="button" onclick="copiarPix()">Copiar</button>
    </div>

    <p class="info">Cole abaixo o código recebido:</p>
    <input id="codigoPRO" type="text" placeholder="Ex: PRO-XXXX-XXXX">
    <button class="btn-principal" type="button" onclick="ativarPRO()">Ativar PRO</button>
    <button class="fechar" type="button" onclick="fecharPagamento()">Cancelar</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
