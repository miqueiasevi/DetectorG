<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DetectorG</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header class="topo">
  <div class="logo">
    <i class="fa-solid fa-shield-halved"></i>
    <span>DetectorG</span>
  </div>
  <p id="usuarioLogado" class="subtitulo"></p>
</header>

<main class="container">

  <p id="status" class="status"></p>

  <!-- VERIFICADOR -->
  <div class="card">
    <h2><i class="fa-solid fa-link"></i> Verificar link ou site</h2>

    <input id="link" type="text" placeholder="Cole o link ou site aqui">

    <button class="btn-principal" onclick="verificarLink()">
      <i class="fa-solid fa-magnifying-glass"></i> Verificar
    </button>

    <p id="resultado" class="resultado"></p>
    <p id="contador" class="contador"></p>
  </div>

  <!-- PLANOS -->
  <h3 class="titulo-planos">Plano pago</h3>

  <div class="planos">
    <div class="plano destaque">
      <h4><i class="fa-solid fa-star"></i> PRO</h4>
      <p>✔ Verificações ilimitadas</p>
      <p>✔ Detecção avançada</p>
      <p>✔ Sem anúncios</p>

      <button class="btn-secundario" onclick="gerarPagamento()">
        Assinar PRO
      </button>
    </div>
  </div>

</main>

<!-- MODAL -->
<div id="pagamento" class="modal hidden" onclick="fecharPagamento()">
  <div class="modal-box plano destaque" onclick="event.stopPropagation()">

    <h4><i class="fa-solid fa-star"></i> Plano PRO</h4>
    <p><strong>Valor:</strong> R$ 9,90</p>

    <!-- QR CODE -->
    <img id="qrCode" style="width:200px; display:none; margin:auto;">

    <!-- PIX COPIAR -->
    <textarea id="pixCode" readonly style="width:100%; display:none;"></textarea>

    <button class="btn-secundario" onclick="copiarPix()">Copiar código Pix</button>

    <p class="info">Após o pagamento, o PRO será ativado automaticamente.</p>

    <button class="fechar" onclick="fecharPagamento()">Fechar</button>

  </div>
</div>

<script>
let usuario = localStorage.getItem("usuario") || "user_" + Math.floor(Math.random()*10000);
localStorage.setItem("usuario", usuario);

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("usuarioLogado").innerText = "Usuário: " + usuario;
  carregarStatus();
});

// STATUS
async function carregarStatus() {
  const res = await fetch("/status_pro", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ usuario })
  });

  const data = await res.json();

  document.getElementById("status").innerText =
    data.pro ? "🔥 PRO ativo" : "Plano FREE (3/dia)";
}

// VERIFICAR LINK
async function verificarLink() {
  let link = document.getElementById("link").value;

  if (!link) {
    alert("Digite um link!");
    return;
  }

  const res = await fetch("/verificar", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ link, usuario })
  });

  const data = await res.json();

  if (data.status === "ok") {
    document.getElementById("resultado").innerHTML =
      `<b>Nível:</b> ${data.resultado.nivel}<br>
       <b>Riscos:</b> ${data.resultado.riscos.join(", ") || "Nenhum"}`;

    document.getElementById("contador").innerText =
      data.restantes !== undefined ? "Restantes: " + data.restantes : "";
  } else {
    document.getElementById("resultado").innerText = data.mensagem;
  }
}

// 🔥 GERAR PAGAMENTO REAL (MERCADO PAGO)
async function gerarPagamento() {

  abrirPagamento();

  const res = await fetch("/criar_pagamento", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ usuario })
  });

  const data = await res.json();

  if (data.status === "ok") {

    document.getElementById("qrCode").src =
      "data:image/png;base64," + data.qr_code_base64;

    document.getElementById("qrCode").style.display = "block";

    document.getElementById("pixCode").value = data.pix;
    document.getElementById("pixCode").style.display = "block";

  } else {
    alert("Erro ao gerar pagamento");
  }
}

// MODAL
function abrirPagamento() {
  document.getElementById("pagamento").classList.remove("hidden");
}

function fecharPagamento() {
  document.getElementById("pagamento").classList.add("hidden");
}

// COPIAR PIX
function copiarPix() {
  let pix = document.getElementById("pixCode");
  pix.select();
  document.execCommand("copy");
  alert("Pix copiado!");
}
</script>

</body>
  </html>
