<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DetectorG</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

header {
  background: #1e3a8a;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.pro-card {
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.pro-btn {
  background: #facc15;
  color: black;
}

#pix-area img {
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  🛡️ DetectorG
</header>

<div class="container">

  <!-- FREE -->
  <div class="card">
    <h2>🔎 Verificar Link</h2>
    <input id="link" placeholder="Cole o link aqui">
    <button onclick="verificar()">Verificar</button>
    <p id="resultado"></p>
  </div>

  <!-- PRO -->
  <div class="pro-card">
    <h2>🚀 Plano PRO</h2>
    <p>✔ Análise avançada</p>
    <p>✔ Detecção de phishing</p>
    <p>✔ Score completo</p>

    <button class="pro-btn" onclick="comprar()">Ativar por R$10</button>

    <div id="pix-area"></div>
  </div>

</div>

<script>
let usuario = localStorage.getItem("usuario") || "user_" + Math.floor(Math.random()*10000);
localStorage.setItem("usuario", usuario);

// VERIFICAR LINK
async function verificar() {
  let link = document.getElementById("link").value;

  const res = await fetch("/verificar", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ link, usuario })
  });

  const data = await res.json();

  if (data.status === "ok") {
    document.getElementById("resultado").innerHTML =
      "Nível: " + data.resultado.nivel +
      "<br>Riscos: " + data.resultado.riscos.join(", ");
  }
}

// COMPRAR PRO
async function comprar() {
  const res = await fetch("/criar_pagamento", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ usuario })
  });

  const data = await res.json();

  if (data.status === "ok") {
    document.getElementById("pix-area").innerHTML = `
      <p>Escaneie o QR Code:</p>
      <img src="data:image/png;base64,${data.qr_code_base64}" width="200"/>
      <p>PIX copia e cola:</p>
      <textarea>${data.pix}</textarea>
    `;
  }
}
</script>

</body>
</html>
