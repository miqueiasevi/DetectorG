<script>
let usuario = localStorage.getItem("usuario") || "user_" + Math.floor(Math.random()*10000);
localStorage.setItem("usuario", usuario);

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("usuarioLogado").innerText = "Usuário: " + usuario;
  carregarStatus();
});

// STATUS
async function carregarStatus() {
  try {
    const res = await fetch("/status_pro", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ usuario })
    });

    const data = await res.json();

    document.getElementById("status").innerText =
      data.pro ? "🔥 PRO ativo" : "Plano FREE (3/dia)";

  } catch {
    document.getElementById("status").innerText = "Erro ao conectar com servidor";
  }
}

// VERIFICAR LINK
async function verificarLink() {
  let link = document.getElementById("link").value;

  if (!link) {
    alert("Digite um link!");
    return;
  }

  const res = await fetch("/verificar", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ link, usuario })
  });

  const data = await res.json();

  if (data.status === "ok") {
    document.getElementById("resultado").innerHTML =
      `<b>Nível:</b> ${data.resultado.nivel}<br>
       <b>Riscos:</b> ${data.resultado.riscos.join(", ") || "Nenhum"}`;

    document.getElementById("contador").innerText =
      data.restantes !== undefined ? "Restantes: " + data.restantes : "";
  } else {
    document.getElementById("resultado").innerText = data.mensagem;
  }
}

// 🔥 PAGAMENTO REAL MERCADO PAGO
async function gerarPagamento() {

  abrirPagamento();

  try {
    const res = await fetch("/criar_pagamento", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ usuario })
    });

    const data = await res.json();

    console.log("RESPOSTA PIX:", data); // 🔥 DEBUG

    if (data.status === "ok") {

      // ✅ GARANTE QUE QR EXISTE
      if (data.qr_code_base64) {
        document.getElementById("qrCode").src =
          "data:image/png;base64," + data.qr_code_base64;

        document.getElementById("qrCode").style.display = "block";
      } else {
        alert("QR Code não recebido");
      }

      // ✅ GARANTE PIX EXISTE
      if (data.pix) {
        document.getElementById("pixCode").value = data.pix;
        document.getElementById("pixCode").style.display = "block";
      } else {
        alert("Código PIX não recebido");
      }

    } else {
      alert(data.mensagem || "Erro ao gerar pagamento");
      console.log("DEBUG:", data.debug);
    }

  } catch (e) {
    console.error(e);
    alert("Erro ao conectar com servidor");
  }
}

// MODAL
function abrirPagamento() {
  document.getElementById("pagamento").classList.remove("hidden");

  // 🔥 LIMPA ANTES DE GERAR NOVO
  document.getElementById("qrCode").style.display = "none";
  document.getElementById("pixCode").style.display = "none";
}

function fecharPagamento() {
  document.getElementById("pagamento").classList.add("hidden");
}

// COPIAR PIX (🔥 FUNCIONA EM QUALQUER AMBIENTE)
function copiarPix() {
  let pix = document.getElementById("pixCode");

  if (!pix.value) {
    alert("Nenhum código PIX disponível");
    return;
  }

  if (navigator.clipboard) {
    navigator.clipboard.writeText(pix.value)
      .then(() => alert("Pix copiado!"))
      .catch(() => copiarFallback(pix));
  } else {
    copiarFallback(pix);
  }
}

function copiarFallback(elemento) {
  elemento.select();
  document.execCommand("copy");
  alert("Pix copiado!");
}
</script>
